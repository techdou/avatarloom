[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avatarloom-protocol"
version = "0.1.0"
description = "AvatarLoom event protocol and envelope schemas (single source of truth)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/avatarloom_protocol"]

[tool.hatch.build.targets.wheel.force-include]
"src/avatarloom_protocol/py.typed" = "avatarloom_protocol/py.typed"
