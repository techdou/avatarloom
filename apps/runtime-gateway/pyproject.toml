[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avatarloom-runtime-gateway"
version = "0.1.0"
description = "AvatarLoom Runtime Gateway — browser WebSocket entrypoint"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "avatarloom-protocol>=0.1.0",
    "avatarloom-sdk>=0.1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "websockets>=13",
    "anyio>=4.6",
    "structlog>=24.4",
    "pyyaml>=6.0.2",
    "numpy>=1.26",
    "httpx>=0.28",
]

[tool.hatch.build.targets.wheel]
packages = ["src/avatarloom_runtime_gateway"]
