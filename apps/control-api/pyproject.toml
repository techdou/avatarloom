[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avatarloom-control-api"
version = "0.1.0"
description = "AvatarLoom Control Plane REST API"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "avatarloom-protocol>=0.1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "anyio>=4.6",
    "structlog>=24.4",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/avatarloom_control_api"]
