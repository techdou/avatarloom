name: avatarloom

# Backward-compatible compose entrypoint. Prefer ../docker-compose.yml for new deployments.

services:
  control-api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.control-api
    ports:
      - "8100:8100"
    environment:
      AVATARLOOM_HOST: "0.0.0.0"
      AVATARLOOM_CONTROL_API_PORT: "8100"
      AVATARLOOM_API_TOKEN: "${AVATARLOOM_API_TOKEN:-}"
      AVATARLOOM_AUTH_DISABLED: "${AVATARLOOM_AUTH_DISABLED:-1}"
      AVATARLOOM_WORKSPACE_ROOT: "/app"
      AVATARLOOM_DB_URL: "sqlite+aiosqlite:////app/data/avatarloom.db"
      AVATARLOOM_ARTIFACTS_ROOT: "/app/data/artifacts"
      AVATARLOOM_RUNS_ROOT: "/app/data/runs"
    volumes:
      - avatarloom_data:/app/data
    restart: unless-stopped

  runtime-gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.runtime-gateway
    ports:
      - "8101:8101"
    environment:
      AVATARLOOM_HOST: "0.0.0.0"
      AVATARLOOM_RUNTIME_GATEWAY_PORT: "8101"
      AVATARLOOM_API_TOKEN: "${AVATARLOOM_API_TOKEN:-}"
      AVATARLOOM_AUTH_DISABLED: "${AVATARLOOM_AUTH_DISABLED:-1}"
      AVATARLOOM_CONTROL_API_TOKEN: "${AVATARLOOM_API_TOKEN:-}"
      AVATARLOOM_CONTROL_API_URL: "http://control-api:8100"
      AVATARLOOM_WORKSPACE_ROOT: "/app"
      AVATARLOOM_DEFAULT_PROFILE: "${AVATARLOOM_DEFAULT_PROFILE:-mock}"
      AVATARLOOM_SELF_RESTART: "${AVATARLOOM_SELF_RESTART:-1}"
      AVATARLOOM_ARTIFACTS_ROOT: "/app/data/artifacts"
      AVATARLOOM_RUNS_ROOT: "/app/data/runs"
    volumes:
      - avatarloom_data:/app/data
    depends_on:
      - control-api
    restart: unless-stopped

  studio:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.studio
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      CONTROL_API_BASE: "http://control-api:8100/api"
      RUNTIME_GATEWAY_BASE: "http://runtime-gateway:8101/api"
      AVATARLOOM_API_TOKEN: "${AVATARLOOM_API_TOKEN:-}"
      AVATARLOOM_AUTH_DISABLED: "${AVATARLOOM_AUTH_DISABLED:-1}"
    depends_on:
      - runtime-gateway
    restart: unless-stopped

volumes:
  avatarloom_data:
