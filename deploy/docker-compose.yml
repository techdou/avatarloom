# AvatarLoom Docker Compose
#
# 用法：
#   docker compose -f deploy/docker-compose.yml config     # 校验配置
#   docker compose -f deploy/docker-compose.yml up          # 启动
#   docker compose -f deploy/docker-compose.yml down        # 停止
#
# 默认真实链路（AVATARLOOM_DEFAULT_PROFILE=lite-12gb）——需要 12GB GPU + LLM_API_KEY。
# 无 GPU 演示：AVATARLOOM_DEFAULT_PROFILE=mock docker compose up
# 真实档位切换：改 AVATARLOOM_DEFAULT_PROFILE 为 profiles/ 里的其他档位（如 autodl-best）。
#
# 鉴权（fail-closed）：后端默认 AVATARLOOM_AUTH_DISABLED=0——不设
# AVATARLOOM_API_TOKEN 时所有端点 401/403（拒绝裸奔），healthcheck 也会失败
# 导致依赖服务不启动。两种可用形态：
#   1) 设 AVATARLOOM_API_TOKEN=<随机串>（推荐）：control-api/gateway 全端点
#      Bearer 校验；studio 容器持同一 token 做服务端代理注入（浏览器不接触）。
#   2) 显式 AVATARLOOM_AUTH_DISABLED=1 且 token 留空：仅限本机受控环境调试。

services:
  control-api:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.control-api
    ports:
      # 宿主侧端口可覆盖：CONTROL_API_PORT=27810 docker compose up
      # 默认绑 127.0.0.1；需公网访问时改为 "${CONTROL_API_PORT:-27810}:27810" 并务必设置 token。
      - "127.0.0.1:${CONTROL_API_PORT:-27810}:27810"
    environment:
      - AVATARLOOM_HOST=0.0.0.0
      - AVATARLOOM_CONTROL_API_PORT=27810
      - AVATARLOOM_DB_URL=sqlite+aiosqlite:///./data/avatarloom.db
      - AVATARLOOM_RUNS_ROOT=/app/data/runs
      - AVATARLOOM_ARTIFACTS_ROOT=/app/data/artifacts
      # Bearer token；设置后 gateway/studio 用同一值（见下）。fail-closed：
      # 留空且未显式 AUTH_DISABLED=1 时全端点 401。
      - AVATARLOOM_API_TOKEN=${AVATARLOOM_API_TOKEN:-}
      - AVATARLOOM_AUTH_DISABLED=${AVATARLOOM_AUTH_DISABLED:-0}
    volumes:
      - avatarloom-data:/app/data
    healthcheck:
      # token 非空：带真实值才 200；token 空 + AUTH_DISABLED=1：带空 Bearer 放行；
      # token 空 + AUTH_DISABLED=0（默认）：401 → healthcheck 失败，正确暴露漏配。
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $$AVATARLOOM_API_TOKEN\" http://localhost:27810/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  runtime-gateway:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.runtime-gateway
    ports:
      # 默认绑 127.0.0.1——WS 无鉴权时公网暴露可被任何人连入发起 GPU 会话。
      - "127.0.0.1:${RUNTIME_GATEWAY_PORT:-27811}:27811"
    environment:
      - AVATARLOOM_HOST=0.0.0.0
      - AVATARLOOM_RUNTIME_GATEWAY_PORT=27811
      - AVATARLOOM_CONTROL_API_URL=http://control-api:27810
      # 与 control-api 的 AVATARLOOM_API_TOKEN 保持一致；control-api 关鉴权时留空。
      - AVATARLOOM_CONTROL_API_TOKEN=${AVATARLOOM_API_TOKEN:-}
      # WS 入口鉴权（gateway 自身校验 /ws/realtime 用的同一套 token；fail-closed：
      # 留空且未显式 AUTH_DISABLED=1 时握手 403）。
      - AVATARLOOM_API_TOKEN=${AVATARLOOM_API_TOKEN:-}
      - AVATARLOOM_AUTH_DISABLED=${AVATARLOOM_AUTH_DISABLED:-0}
      # 默认真实链路（lite-12gb）——需要 12GB GPU + LLM_API_KEY。
      # 无 GPU 环境降级：AVATARLOOM_DEFAULT_PROFILE=mock docker compose up
      - AVATARLOOM_DEFAULT_PROFILE=${AVATARLOOM_DEFAULT_PROFILE:-lite-12gb}
      # 真实 Adapter 用——从 compose 旁的 .env 读
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
    volumes:
      - avatarloom-data:/app/data
    depends_on:
      control-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:27811/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # GPU 支持（需要 NVIDIA Container Toolkit）：
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  studio:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.studio
      args:
        # NEXT_PUBLIC_* 在构建期内联到浏览器 bundle；仅适合单用户受控隧道。
        NEXT_PUBLIC_WS_TOKEN: ${AVATARLOOM_API_TOKEN:-}
    ports:
      # 默认绑 127.0.0.1——Studio 的服务端 rewrites 代理 control-api，
      # 无鉴权时公网暴露等于把 API 全端点公开。
      - "127.0.0.1:${STUDIO_PORT:-27300}:27300"
    environment:
      - NODE_ENV=production
      - PORT=27300
      # 服务端 rewrites 代理目标——容器内 127.0.0.1 不通，必须走服务名。
      # （浏览器侧 WS 仍直连宿主 ${RUNTIME_GATEWAY_PORT:-27811}，不经此变量。）
      - CONTROL_API_BASE=http://control-api:27810/api
      - RUNTIME_GATEWAY_BASE=http://runtime-gateway:27811/api
      # middleware.ts 用这两个 token 在服务端注入 Authorization（token 模式下
      # 浏览器请求经 Next 代理自动带 Bearer；SSR 直连同用）。与后端同值。
      - CONTROL_API_TOKEN=${AVATARLOOM_API_TOKEN:-}
      - GATEWAY_API_TOKEN=${AVATARLOOM_API_TOKEN:-}
    depends_on:
      control-api:
        condition: service_healthy
      runtime-gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  avatarloom-data:
