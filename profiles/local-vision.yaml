apiVersion: avatarloom.io/v1alpha1
kind: RuntimeProfile
metadata:
  id: local-vision
  name: Local Vision (Mock Pipeline + MiniMax Vision)
  description: >
    本地无 GPU 验证真实多模态视觉链路的配置。
    VAD/STT/LLM/TTS/Avatar 走 Mock，只有 Vision 调用真实的
    MiniMax 多模态 API（OpenAI 兼容端点）。
    需要在环境变量（或 .env）里配置 VISION_API_KEY。
blocks:
  vad:
    id: vad.mock
    deployment: mock
    config:
      energy_threshold: 300.0
      min_speech_chunks: 2
      silence_chunks_to_end: 3
  stt:
    id: stt.mock
    deployment: mock
    config:
      mode: random
  llm:
    id: llm.mock
    deployment: mock
    config:
      chunk_delay_ms: 30
  tts:
    id: tts.mock
    deployment: mock
    config:
      frequency: 440.0
      ms_per_char: 60
  avatar:
    id: avatar.mock
    deployment: mock
  vision:
    id: vision.openai-compatible
    deployment: remote
    optional: true
    config:
      baseUrl: ${VISION_BASE_URL}
      apiKeyEnv: VISION_API_KEY
      model: ${VISION_MODEL}
sync:
  audio_delay_ms: 600
  video_lag_frames: 0
  max_video_behind_ms: 1000
  drop_policy: drop_oldest_video
session:
  mode: single
  allow_interruption: true
  event_log: true
