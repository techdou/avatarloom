apiVersion: avatarloom.io/v1alpha1
kind: RuntimeProfile
metadata:
  id: autodl-best
  name: AutoDL Best (DeepSeek + VoxCPM2 + MuseTalk)
  description: >
    AutoDL RTX 5090 32GB 最佳效果配置。
    DeepSeek 云端 LLM + 本地 VoxCPM2 流式克隆 TTS + MuseTalk 口型驱动 Avatar。
    显存占用约 11-16GB / 32GB。
blocks:
  vad:
    id: vad.silero
    deployment: local
    config:
      device: cpu
      threshold: 0.5
      minSilenceMs: 500
  stt:
    id: stt.sensevoice
    deployment: local
    config:
      model: /root/autodl-tmp/modelscope/models/iic--SenseVoiceSmall/snapshots/master
      device: cuda
      language: zh
  llm:
    id: llm.openai-compatible
    deployment: remote
    config:
      baseUrl: ${LLM_BASE_URL}
      apiKeyEnv: LLM_API_KEY
      model: ${LLM_MODEL}
      maxTokens: 200
      temperature: 0.6
      disableThinking: true
      systemPrompt: "你是小灵，一个温柔亲切的数字人语音助理。回答简短自然，最多2-3句话，不要使用Markdown符号或列表，适合语音合成朗读。"
  tts:
    id: tts.voxcpm2
    deployment: local
    config:
      device: cuda
      model: /root/autodl-tmp/modelscope-voxcpm
      rate: 0.886
      streaming: true
      blocksize: 512
      cfgValue: 2.0
      inferenceTimesteps: 5
      normalize: true
      denoise: false
      stylePrefix: "温柔女声，自然亲切"
      promptText: "你好，很高兴认识你。今天过得怎么样？"
      voiceRef: personas/demo-assistant/voice/ref.wav
    fallback: tts.mock
  avatar:
    id: avatar.musetalk
    deployment: local
    config:
      device: cuda
      portrait: personas/demo-assistant/avatar/portrait.jpg
      fps: 25
      workerPython: /root/autodl-tmp/musetalk-venv/bin/python
      workerScript: scripts/muse_worker.py
      musetalkRoot: /root/autodl-tmp/musetalk
      version: v1
      batchSize: 8
      crf: 18
      activityFps: 2.5
      maxSide: 1280
    fallback: avatar.static
  vision:
    id: vision.openai-compatible
    deployment: remote
    optional: true
    # baseUrl/model 缺省时从环境变量 VISION_BASE_URL / VISION_MODEL 读取
sync:
  audio_delay_ms: 800
  video_lag_frames: 0
  max_video_behind_ms: 1000
  drop_policy: drop_oldest_video
session:
  mode: single
  allowInterruption: true
  event_log: true
