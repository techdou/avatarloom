apiVersion: avatarloom.io/v1alpha1
kind: RuntimeProfile
metadata:
  id: local-tts-test
  name: Local TTS GPU Test
  description: >
    本机 GPU 验证档——只把 TTS (Qwen3-TTS) 放到 GPU，其余走 CPU/mock/远程。
    验证目标：VAD(silero CPU) → STT(mock) → LLM(远程) → TTS(Qwen3 GPU) 链路。
    显存需求 ~3GB，适合 12GB Laptop GPU。
blocks:
  vad:
    id: vad.silero
    deployment: local
    config:
      device: cpu
      threshold: 0.5
      minSilenceMs: 500
  stt:
    id: stt.mock
    deployment: mock
    config:
      mode: random
  llm:
    id: llm.openai-compatible
    deployment: remote
    config:
      baseUrl: ${LLM_BASE_URL}
      apiKeyEnv: LLM_API_KEY
      model: ${LLM_MODEL}
      maxTokens: 256
      temperature: 0.6
      disableThinking: true
      systemPrompt: "你是小灵，一个温柔亲切的数字人语音助理。回答简短自然，最多2-3句话。"
  tts:
    id: tts.qwen3
    deployment: local
    config:
      device: cuda
      model: Qwen/Qwen3-TTS-12Hz-0.6B-Base
    fallback: tts.mock
  avatar:
    id: avatar.mock
    deployment: mock
  vision:
    id: vision.mock
    deployment: mock
    optional: true
sync:
  audio_delay_ms: 600
  video_lag_frames: 0
  max_video_behind_ms: 1000
  drop_policy: drop_oldest_video
session:
  mode: single
  allowInterruption: true
  event_log: true
